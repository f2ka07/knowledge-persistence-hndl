[project]
name = "pqm-readiness"
version = "0.1.0"
description = "Reproducible dataset pipeline for knowledge persistence research"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "CC-BY-4.0" }
dependencies = [
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=17.0",
    "duckdb>=1.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13.7",
    "loguru>=0.7",
    "truststore>=0.9",
    "certifi>=2024.0",
    "lifelines>=0.30",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.8",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
pqm = "pqm_readiness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pqm_readiness"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
